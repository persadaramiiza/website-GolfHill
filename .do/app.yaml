name: golfhill-terraces

services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/website-GolfHill   # <-- change this
      branch: main
      deploy_on_push: true
    build_command: |
      composer install --no-dev --optimize-autoloader
      npm ci
      npm run build
    run_command: php artisan migrate --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=8080
    environment_slug: php
    instance_count: 1
    instance_size_slug: basic-xxs   # $5/month — upgrade to basic-xs for more traffic
    http_port: 8080
    envs:
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "REPLACE_WITH_YOUR_APP_KEY"   # php artisan key:generate --show
      - key: LOG_CHANNEL
        value: "stderr"
      - key: SESSION_DRIVER
        value: "database"
      - key: QUEUE_CONNECTION
        value: "database"
      - key: CACHE_STORE
        value: "database"

      # Database — fill these from your DO managed MySQL
      - key: DB_CONNECTION
        value: "mysql"
      - key: DB_HOST
        value: "REPLACE_WITH_DO_DB_HOST"
      - key: DB_PORT
        value: "25060"
      - key: DB_DATABASE
        value: "REPLACE_WITH_DB_NAME"
      - key: DB_USERNAME
        value: "REPLACE_WITH_DB_USER"
      - key: DB_PASSWORD
        value: "REPLACE_WITH_DB_PASSWORD"
        type: SECRET

      # Cloudflare R2 — copy from your current .env
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        value: "REPLACE"
        type: SECRET
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        value: "REPLACE"
        type: SECRET
      - key: CLOUDFLARE_R2_BUCKET
        value: "golfhill-storage"
      - key: CLOUDFLARE_R2_ENDPOINT
        value: "REPLACE_WITH_YOUR_R2_ENDPOINT"
      - key: CLOUDFLARE_R2_URL
        value: "REPLACE_WITH_YOUR_R2_PUBLIC_URL"

databases:
  - name: golfhill-db
    engine: MYSQL
    version: "8"
    num_nodes: 1
    size: db-s-1vcpu-1gb   # $15/month managed MySQL — or use external DB to save cost

jobs:
  - name: migrate
    github:
      repo: YOUR_GITHUB_USERNAME/website-GolfHill   # <-- same repo as service
      branch: main
    kind: PRE_DEPLOY
    run_command: php artisan migrate --force
    environment_slug: php
    instance_size_slug: basic-xxs

workers:
  - name: queue-worker
    github:
      repo: YOUR_GITHUB_USERNAME/website-GolfHill   # <-- same repo as service
      branch: main
      deploy_on_push: true
    build_command: |
      composer install --no-dev --optimize-autoloader
    run_command: php artisan queue:work --sleep=3 --tries=3 --timeout=300 --queue=default
    environment_slug: php
    instance_count: 1
    instance_size_slug: basic-xxs   # $5/month — processes queued WebP conversions
    envs:
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: "stderr"
      - key: QUEUE_CONNECTION
        value: "database"
      # ── Copy remaining env vars from the web service above ──
      # DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD,
      # CLOUDFLARE_R2_*, APP_KEY, FILESYSTEM_DISK, etc.
