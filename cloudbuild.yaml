substitutions:
  _REGION: asia-southeast2
  _REPOSITORY: golfhill-app
  _SERVICE_NAME: golfhill-cloudrun-learn
  _IMAGE_NAME: golfhill-app

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-docker-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'scan-docker-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --severity HIGH,CRITICAL \
          --exit-code 0 \
          --ignore-unfixed \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-docker-image'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-to-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'APP_NAME=GolfHill,APP_ENV=production,APP_DEBUG=false,DB_CONNECTION=mysql,DB_HOST=golfhill-mysql-free-persadaramiiza.l.aivencloud.com,DB_PORT=23153,DB_DATABASE=golfhill,DB_USERNAME=avnadmin,MYSQL_ATTR_SSL_CA=/workspace/certs/aiven-ca.pem,SESSION_DRIVER=cookie,CACHE_STORE=array,QUEUE_CONNECTION=sync,FILESYSTEM_DISK=r2,LOG_CHANNEL=stderr,LOG_LEVEL=debug,CLOUDFLARE_R2_BUCKET=golfhill-storage,CLOUDFLARE_R2_ENDPOINT=https://c43f3c9661c86bd92cff0a1b1de8f07e.r2.cloudflarestorage.com,CLOUDFLARE_R2_URL=https://pub-7eb63b4e4c5d4996a04ca176a08a1f83.r2.dev'
      - '--set-secrets'
      - 'APP_KEY=golfhill-app-key:latest,DB_PASSWORD=golfhill-db-password:latest,CLOUDFLARE_R2_ACCESS_KEY_ID=golfhill-r2-access-key:latest,CLOUDFLARE_R2_SECRET_ACCESS_KEY=golfhill-r2-secret-key:latest,/workspace/certs/aiven-ca.pem=golfhill-aiven-ca:latest'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID'